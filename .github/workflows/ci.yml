name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: selvedge
          POSTGRES_PASSWORD: selvedge_test_password
          POSTGRES_DB: selvedge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run PostgreSQL storage tests
        env:
          SELVEDGE_TEST_POSTGRES_URL: postgres://selvedge:selvedge_test_password@localhost:5432/selvedge_test?sslmode=disable
        run: go test -race -tags=postgres,pglocal -count=1 ./internal/storage

      - name: Build
        run: go build ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: selvedge
          POSTGRES_PASSWORD: selvedge_test_password
          POSTGRES_DB: selvedge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run PostgreSQL integration tests
        env:
          SELVEDGE_TEST_POSTGRES_URL: postgres://selvedge:selvedge_test_password@localhost:5432/selvedge_test?sslmode=disable
        run: go test -race -tags=integration -count=1 -timeout=25m ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags=integration,postgres,pglocal
