minimum_prek_version: "0.5.10"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: quality-fast
        name: Go fast quality gates
        entry: make check-fast
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: quality-full
        name: Go full quality gates
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push, manual]
